<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f5e5e">
  <title>School Management System</title>

  <!-- PWA: installable + offline-capable -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SMS">

  <link rel="stylesheet" href="css/app.css?v=20260803b">
  <link rel="stylesheet" href="css/report.css?v=20260803b">
</head>
<body>
  <div id="root"><div class="loader">Loading…</div></div>
  <div id="toast-host" aria-live="polite" role="status"></div>

  <script>
    // ---- API base URL per environment (see /DEPLOY.md) ----
    // Render hosts this static frontend ONLY and never runs api/index.php.
    // SMS_API_BASE must be a URL this page can reach the PHP API at:
    //   - same-origin PHP host (frontend + api/ deployed together)  -> 'api/index.php'
    //   - split-origin (frontend on Render, API on cPanel/Namecheap) -> the API's
    //     full URL, e.g. 'https://api.yourschoolsms.com/api/index.php'
    // useApi stays false (Local/localStorage mode) until that PHP+MySQL API is
    // actually deployed and reachable at SMS_API_BASE.
    var SMS_API_BASE = 'api/index.php';
    window.DB_CONFIG = { useApi: false, apiBase: SMS_API_BASE };
  </script>

  <!-- NOTE: every ?v= tag below must be bumped together, in step with
       sw.js's CACHE_VERSION. Bumping only the files you touched leaves
       browsers (and the installed PWA) serving stale copies of the rest. -->
  <script src="js/seed.js?v=20260803b"></script>
  <script src="js/store.js?v=20260803b"></script>
  <script src="js/util.js?v=20260803b"></script>

  <script src="js/auth-lib.js?v=20260803b"></script>
  <script src="js/grading.js?v=20260803b"></script>
  <script src="js/finance-lib.js?v=20260803b"></script>
  <script src="js/payroll-lib.js?v=20260803b"></script>
  <script src="js/reports-lib.js?v=20260803b"></script>
  <script src="js/bulk.js?v=20260803b"></script>
  <script src="js/report.js?v=20260803b"></script>
  <script src="js/services.js?v=20260803b"></script>

  <script src="js/automation.js?v=20260803b"></script>

  <script src="js/license-lib.js?v=20260803b"></script>

  <!-- Owner/platform console (the /admin area). Loaded before app.js so
       window.Platform already exists when app.js hands over to it. -->
  <script src="js/platform.js?v=20260803b"></script>

  <script src="js/app.js?v=20260803b"></script>

  <script src="js/views/dashboard.js?v=20260803b"></script>
  <script src="js/views/students.js?v=20260803b"></script>
  <script src="js/views/assessment.js?v=20260803b"></script>
  <script src="js/views/finance.js?v=20260803b"></script>
  <script src="js/views/attendance.js?v=20260803b"></script>
  <script src="js/views/communication.js?v=20260803b"></script>
  <script src="js/views/inventory.js?v=20260803b"></script>
  <script src="js/views/accounting.js?v=20260803b"></script>
  <script src="js/views/payroll.js?v=20260803b"></script>
  <script src="js/views/administration.js?v=20260803b"></script>
  <script src="js/views/settings.js?v=20260803b"></script>
  <script src="js/views/subscription.js?v=20260803b"></script>

  <!-- PWA: register the service worker (offline + installable) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
